model_name: ltx_train
is_i2v: true
report_to: tensorboard
tracker_name: joint_video_action_adapt
view_mode: front
logging_dir: tensorboard
output_dir: /data/home/scyb955/run/sunyuhan/projects/exp/drivelaw_joint_video_action_adapt
pretrained_model_name_or_path: /data/home/scyb955/run/sunyuhan/projects/models/DriveLaW_weights/DriveLaW-Video

tokenizer_class_path: transformers
tokenizer_class: T5Tokenizer
textenc_class_path: transformers
textenc_class: T5EncoderModel
vae_class_path: diffusers
vae_class: AutoencoderKLLTXVideo
diffusion_model_class_path: /data/run01/scyb955/sunyuhan/projects/SD/DriveLaW-Act/navsim/agents/videodrive/video_models/ltx_models/transformer_ltx.py
diffusion_model_class: LTXVideoTransformer3DModel
diffusion_scheduler_class_path: diffusers
diffusion_scheduler_class: FlowMatchEulerDiscreteScheduler
pipeline_class_path: /data/run01/scyb955/sunyuhan/projects/SD/DriveLaW-Act/navsim/agents/videodrive/video_models/pipeline/pipeline_ltx_condition.py
pipeline_class: LTXConditionPipeline

return_action: true
return_video: true
train_mode: video_action_adapt
future_video_frames: 8
video_loss_scale: 1.0
action_loss_scale: 1.0

# One full pass over 139,284 samples with global batch size 2.
train_steps: 69642
train_epochs: 100
steps_to_save: 5000
steps_to_log: 10
steps_to_val: 5000

mixed_precision: bf16
allow_tf32: false
nccl_timeout: 1800
seed: 42

enable_slicing: true
enable_tiling: true
add_state: false
caption_dropout_p: 0.06
gradient_checkpointing: true
noise_to_first_frame: 0.0
use_color_jitter: false

optimizer: adamw
lr: 1.0e-5
beta1: 0.9
beta2: 0.95
beta3: 0.999
epsilon: 1.0e-8
weight_decay: 1.0e-5
optimizer_8bit: false
optimizer_torchao: false
scale_lr: false
max_grad_norm: 1.0
lr_scheduler: constant_with_warmup
lr_warmup_steps: 1000
lr_num_cycles: 1
lr_power: 1.0

# Validation decodes videos and is too expensive for the first training run.
# Use the separate four-scene probe on saved checkpoints instead.
enable_val: false
pixel_wise_timestep: true
flow_weighting_scheme: none
flow_logit_mean: 0.0
flow_logit_std: 1.0
flow_mode_scale: 1.29

diffusion_model:
  model_path: /data/home/scyb955/run/sunyuhan/projects/models/DriveLaW_weights/DriveLaW-Act/diffusion_pytorch_model.safetensors
  config:
    activation_fn: gelu-approximate
    attention_bias: true
    attention_head_dim: 64
    attention_out_bias: true
    caption_channels: 4096
    cross_attention_dim: 2048
    in_channels: 128
    norm_elementwise_affine: false
    norm_eps: 1.0e-6
    num_attention_heads: 32
    num_layers: 28
    out_channels: 128
    patch_size: 1
    patch_size_t: 1
    qk_norm: rms_norm_across_heads
    action_expert: true
    action_in_channels: 3
    action_num_attention_heads: 16
    action_attention_head_dim: 32

load_weights: true
use_ema: false

use_deepspeed: true
deepspeed:
  zero_optimization:
    stage: 2
  fp16:
    enabled: false
  bf16:
    enabled: true
  gradient_clipping: 1.0
